<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>ProtoVid</title>
  <style>
    :root {
      --background: #f3f5fa;
      --surface: #ffffff;
      --surface-tinted: #f8f9fd;
      --surface-elevated: #ffffff;
      --shell: #0d1428;
      --shell-raised: #151d35;
      --border: #dce1eb;
      --border-strong: #c7cedc;
      --divider: #e8ebf2;
      --text-primary: #11182a;
      --text-secondary: #4e596d;
      --text-muted: #636d80;
      --text-inverse: #f8f9ff;
      --primary-action: #3157d5;
      --primary-action-hover: #2546b8;
      --success: #087a55;
      --success-surface: #ecf9f4;
      --warning: #9a5b06;
      --warning-surface: #fff7e7;
      --error: #b3263d;
      --error-surface: #fff1f3;
      --info: #3157d5;
      --info-surface: #eef3ff;
      --focus: #22a3ff;
      --free-plan: #556176;
      --free-plan-surface: #eef1f5;
      --pro-plan: #6741d9;
      --pro-plan-surface: #f0ecff;
      --gradient-brand: linear-gradient(120deg, #365ee8 0%, #773ee4 48%, #ef5f78 76%, #f38b3c 100%);
      --gradient-action: linear-gradient(120deg, #3157d5 0%, #5b36c7 100%);
      --space-0-5: 4px;
      --space-1: 8px;
      --space-1-5: 12px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --radius-control: 9px;
      --radius-card: 14px;
      --radius-pill: 999px;
      --shadow-elevated: 0 8px 24px rgba(18, 27, 51, 0.08);
      --motion-fast: 140ms;
      --motion-standard: 220ms;
      --motion-easing: cubic-bezier(0.2, 0, 0, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body, #app {
      width: 100%;
      height: 100%;
      min-width: 0;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--text-primary);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button, input, summary {
      font: inherit;
    }

    button, a, summary {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible,
    input:focus-visible {
      outline: 2px solid #145cff;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.92);
    }

    button:disabled {
      cursor: not-allowed;
    }

    h1, h2, h3, p, ol, dl, dd {
      margin: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    h1 {
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    h2 {
      font-size: 14px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    h3 {
      font-size: 13px;
      line-height: 1.35;
    }

    .app-shell {
      display: flex;
      width: 100%;
      height: 100%;
      min-width: 0;
      flex-direction: column;
      background: var(--background);
    }

    .app-header {
      position: relative;
      z-index: 20;
      display: flex;
      min-height: 56px;
      flex: 0 0 56px;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-1-5) 0 var(--space-2);
      background: var(--shell);
      color: var(--text-inverse);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .app-header::after {
      position: absolute;
      right: 64px;
      bottom: 0;
      left: 64px;
      height: 1px;
      background: var(--gradient-brand);
      content: "";
      opacity: 0.72;
    }

    .brand-lockup,
    .brand-copy,
    .status-line,
    .format-selected,
    .trust-row summary,
    .success-heading-row,
    .file-identity,
    .secondary-action-row,
    .account-menu summary,
    .inline-notice,
    .checkout-recovery,
    .recovery-actions,
    .review-prompt {
      display: flex;
      align-items: center;
    }

    .brand-lockup {
      min-width: 0;
      gap: 10px;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border-radius: 9px;
      box-shadow: 0 3px 10px rgba(1, 3, 12, 0.3);
    }

    .brand-copy {
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.16;
    }

    .brand-copy strong {
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .brand-copy span {
      margin-top: 2px;
      color: #aeb9d3;
      font-size: 10px;
      font-weight: 500;
    }

    .icon {
      display: block;
      flex: 0 0 auto;
    }

    .icon-button {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: #cad2e6;
      cursor: pointer;
      transition: background var(--motion-fast) var(--motion-easing), color var(--motion-fast) var(--motion-easing);
    }

    .icon-button:hover {
      background: var(--shell-raised);
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-upgrade-button {
      display: inline-flex;
      min-height: 40px;
      max-width: 112px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid rgba(215, 223, 255, 0.28);
      border-radius: var(--radius-pill);
      background: var(--gradient-action);
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(20, 30, 66, 0.22);
      transition: transform var(--motion-fast) var(--motion-easing), box-shadow var(--motion-fast) var(--motion-easing);
    }

    .header-upgrade-button:hover:not(:disabled) {
      box-shadow: 0 6px 16px rgba(20, 30, 66, 0.28);
      transform: translateY(-1px);
    }

    .header-upgrade-button:disabled {
      background: #4b556d;
      color: #cbd3e6;
      box-shadow: none;
    }

    .voice-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      gap: 6px;
      padding: 0 7px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      color: #aeb9d6;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background var(--motion-fast) var(--motion-easing), border-color var(--motion-fast) var(--motion-easing), color var(--motion-fast) var(--motion-easing);
    }

    .voice-button:hover {
      border-color: rgba(177, 190, 224, 0.55);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .voice-button.is-active {
      border-color: #8eb5ff;
      background: rgba(49, 87, 213, 0.55);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(97, 142, 255, 0.18);
    }

    .voice-button.is-active .icon {
      animation: voice-pulse 1.2s ease-in-out infinite;
    }

    .voice-button.has-error {
      border-color: #ff9da9;
      color: #ffd8de;
    }

    @keyframes voice-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    .screen-scroll {
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .setup-scroll,
    .success-scroll,
    .empty-screen-wrap {
      padding: var(--space-1-5);
    }

    .setup-screen,
    .success-screen,
    .empty-screen-wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .setup-screen,
    .success-screen {
      display: flex;
      flex-direction: column;
      gap: var(--space-1-5);
    }

    .section-card {
      min-width: 0;
      padding: var(--space-1-5);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(18, 27, 51, 0.025);
    }

    .section-heading-row {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-1);
      margin-bottom: var(--space-1);
    }

    .section-eyebrow,
    .state-eyebrow {
      margin-bottom: 2px;
      color: var(--pro-plan);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-action {
      flex: 0 0 auto;
    }

    .text-button,
    .secondary-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 var(--space-1);
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--primary-action);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .text-button:hover,
    .secondary-link:hover {
      background: var(--info-surface);
    }

    .text-button.centered {
      margin: var(--space-1) auto 0;
    }

    .secondary-link {
      width: 100%;
      margin-top: var(--space-0-5);
    }

    .status-line {
      min-width: 0;
      align-items: flex-start;
      gap: var(--space-1);
      margin-bottom: var(--space-1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      margin-top: 5px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--success-surface);
    }

    .status-dot-success {
      background: var(--success);
    }

    .status-dot-warning {
      background: var(--warning);
      box-shadow: 0 0 0 3px var(--warning-surface);
    }

    .status-line strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
    }

    .status-line p {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 11px;
    }

    .flow-preview {
      min-width: 0;
      overflow: hidden;
      padding: 10px;
      border: 1px solid #d8def0;
      border-radius: 11px;
      background:
        radial-gradient(circle at 10% 18%, rgba(86, 99, 218, 0.09), transparent 35%),
        linear-gradient(180deg, #f9faff, #f4f6fb);
    }

    .flow-path {
      display: flex;
      min-width: 0;
      min-height: 68px;
      align-items: center;
    }

    .flow-node-wrap {
      display: flex;
      min-width: 0;
      flex: 1 1 0;
      align-items: center;
    }

    .flow-connector {
      position: relative;
      display: block;
      width: 14px;
      height: 2px;
      flex: 0 1 14px;
      background: #9ba7bf;
    }

    .flow-connector::after {
      position: absolute;
      top: -2px;
      right: 0;
      width: 5px;
      height: 5px;
      border-top: 1.5px solid #7e8ba5;
      border-right: 1.5px solid #7e8ba5;
      content: "";
      transform: rotate(45deg);
    }

    .flow-node {
      position: relative;
      display: flex;
      min-width: 0;
      height: 58px;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 6px;
      border: 1px solid #c8cfdd;
      border-radius: 8px;
      background: #fff;
      color: var(--text-secondary);
      box-shadow: 0 2px 6px rgba(22, 33, 59, 0.05);
    }

    .flow-node.is-start {
      border-color: #6b75ea;
      box-shadow: 0 0 0 2px rgba(103, 65, 217, 0.1);
    }

    .flow-node-ui {
      display: block;
      height: 24px;
      border-radius: 4px;
      background:
        linear-gradient(90deg, #d6dcf0 42%, transparent 42%) top/100% 4px no-repeat,
        linear-gradient(135deg, #dce6ff, #f0ddfb 62%, #ffe4d9);
    }

    .flow-node-label {
      max-width: 100%;
      overflow: hidden;
      font-size: 8px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .start-marker {
      position: absolute;
      top: 3px;
      left: 3px;
      padding: 1px 4px;
      border-radius: var(--radius-pill);
      background: #4d3cc3;
      color: #fff;
      font-size: 7px;
      font-weight: 800;
    }

    .flow-overflow {
      display: inline-flex;
      min-width: 28px;
      height: 28px;
      flex: 0 0 28px;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      border-radius: var(--radius-pill);
      background: #e7eaf5;
      color: var(--text-secondary);
      font-size: 9px;
      font-weight: 800;
    }

    .flow-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      margin-top: var(--space-1);
      color: var(--text-secondary);
      font-size: 10px;
    }

    .flow-meta > span {
      min-width: 0;
    }

    .flow-meta > span:last-child {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      gap: 6px;
    }

    .flow-meta strong {
      color: var(--text-primary);
    }

    .plan-badge {
      display: inline-flex;
      min-height: 18px;
      flex: 0 0 auto;
      align-items: center;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .plan-badge-free {
      background: var(--free-plan-surface);
      color: var(--free-plan);
    }

    .plan-badge-pro {
      background: var(--pro-plan-surface);
      color: var(--pro-plan);
    }

    .path-chooser,
    .account-menu,
    .inline-disclosure,
    .trust-row {
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--surface);
    }

    summary {
      list-style: none;
      cursor: pointer;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .path-chooser > summary {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-1-5);
    }

    .path-chooser summary span {
      min-width: 0;
    }

    .path-chooser summary strong,
    .path-chooser summary small {
      display: block;
    }

    .path-chooser summary small {
      max-width: 280px;
      margin-top: 2px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    details[open] > summary .icon {
      transform: rotate(180deg);
    }

    .path-options {
      display: grid;
      gap: 6px;
      padding: 0 var(--space-1) var(--space-1);
    }

    .path-chooser:not([open]) > .path-options,
    .account-menu:not([open]) > .account-menu-panel {
      display: none;
    }

    .path-options button {
      display: flex;
      min-height: 44px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-tinted);
      cursor: pointer;
      text-align: left;
    }

    .path-options button.is-selected {
      border-color: #6672da;
      background: #f1f2ff;
      box-shadow: inset 3px 0 0 #6654dc;
    }

    .path-options span {
      max-width: 100%;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .path-options small {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 9px;
    }

    .control-group {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .control-group legend {
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
    }

    .resolution-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .option-tile {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-control);
      background: var(--surface);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: border var(--motion-fast) var(--motion-easing), background var(--motion-fast) var(--motion-easing), transform var(--motion-fast) var(--motion-easing);
    }

    .option-tile:hover {
      border-color: #8290ad;
      background: var(--surface-tinted);
    }

    .option-tile.is-selected {
      border-color: #4f5fd1;
      background: #f0f2ff;
      color: #253b9b;
      box-shadow: inset 0 0 0 1px rgba(79, 95, 209, 0.16);
    }

    .option-tile.requires-pro:not(.is-selected) {
      color: var(--text-secondary);
    }

    .option-check {
      position: absolute;
      top: 3px;
      right: 3px;
      color: #3b50c4;
    }

    .format-control {
      margin-top: var(--space-1);
      border: 0;
      padding: 0;
    }

    .format-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .format-option {
      display: flex;
      min-width: 0;
      min-height: 46px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: #fff;
      color: var(--text-secondary);
      text-align: center;
    }

    .format-option strong,
    .format-option span {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .format-option strong {
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 850;
    }

    .format-option span {
      color: var(--text-muted);
      font-size: 8px;
      font-weight: 650;
    }

    .format-option.selected {
      border-color: var(--accent);
      background: #f1f3ff;
      box-shadow: 0 0 0 1px rgba(81, 93, 245, 0.25);
    }

    .format-option.selected strong {
      color: #2f3da6;
    }

    .inline-disclosure {
      margin-top: 6px;
      border: 0;
      background: transparent;
    }

    .inline-disclosure summary {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 650;
    }

    .inline-disclosure p {
      padding: 0 6px 6px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .export-summary {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      gap: var(--space-1);
      margin-top: var(--space-1);
      padding-top: var(--space-1);
      border-top: 1px solid var(--divider);
      font-size: 10px;
    }

    .summary-label {
      flex: 0 0 auto;
      color: var(--text-muted);
    }

    .export-summary strong {
      min-width: 0;
      color: var(--text-secondary);
      font-weight: 650;
    }

    .trust-row {
      margin-top: var(--space-1);
      border-color: #d7dfec;
      background: #f8fafc;
    }

    .trust-row summary {
      min-height: 44px;
      align-items: flex-start;
      gap: 7px;
      padding: 8px 9px;
      color: var(--text-secondary);
      font-size: 9px;
    }

    .trust-row summary > .icon {
      margin-top: 1px;
      color: var(--success);
    }

    .trust-row summary > span:nth-child(2) {
      min-width: 0;
      flex: 1 1 auto;
    }

    .learn-more {
      flex: 0 0 auto;
      color: var(--primary-action);
      font-weight: 700;
    }

    .trust-row p {
      padding: 0 9px 9px 33px;
      color: var(--text-muted);
      font-size: 9px;
    }

    .upgrade-choice-panel {
      min-width: 0;
      padding: var(--space-1-5);
      border: 1px solid #c9d6ff;
      border-radius: var(--radius-card);
      background:
        linear-gradient(180deg, rgba(240, 245, 255, 0.98), rgba(255, 255, 255, 0.99));
      box-shadow: 0 4px 18px rgba(49, 87, 213, 0.08);
    }

    .upgrade-choice-copy h2 {
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.2;
    }

    .upgrade-choice-copy p:last-child {
      margin-top: 5px;
      color: #48556f;
      font-size: 10.5px;
      line-height: 1.45;
    }

    .value-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: var(--space-1) 0;
    }

    .value-strip span {
      display: inline-flex;

      text-align: center;

      color: #626b7c;
      box-shadow: none;

      border-color: transparent;
      background: var(--gradient-action);
      color: #fff;
    }

    .sticky-action-bar p {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 9px;
      text-align: center;

      border: 1px solid;

    .inline-notice {

      gap: 8px;
      padding: 9px 10px;
      font-size: 10px;
    }

    .inline-notice .icon {

    }

    .inline-notice-info {
      border-color: #ccd8f7;
      background: var(--info-surface);
      color: #284797;
    }

    .inline-notice-success {
      border-color: #b9e4d3;
      background: var(--success-surface);
      color: #075f45;
    }

    .inline-notice-warning {
      border-color: #eed9ad;
      background: var(--warning-surface);
      color: #754506;
    }

    .error-state {

      align-items: flex-start;
      gap: 10px;

      border-color: #efc0c8;
      background: var(--error-surface);
      color: #721b2a;

      height: 34px;

      align-items: center;
      justify-content: center;

    .notice-icon-error {
      background: #fbdce2;
      color: var(--error);

    .notice-icon-success {
      background: var(--success-surface);
      color: var(--success);
    }

    .error-copy {

      align-items: center;
      gap: 4px;
      margin-top: 6px;

    .secondary-button {

      background: var(--surface);
      color: var(--text-primary);
      font-size: 11px;

      background: var(--info-surface);

    }

    .checkout-recovery strong,
    .checkout-recovery span {

    .checkout-recovery strong {

    }

    .checkout-recovery span {
      color: var(--text-secondary);
      font-size: 9px;
    }

    .recovery-actions {

      gap: 4px;
    }

    .email-capture p {
      margin-top: 3px;
      color: var(--text-secondary);
      font-size: 10px;
    }

    .field-label {
      display: block;
      margin-top: var(--space-1);
      margin-bottom: 4px;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;

      min-height: 42px;

      border-radius: var(--radius-control);
      background: #fff;
      color: var(--text-primary);

    }

    input[type="email"]:focus-visible {

    .upgrade-cta {

    .upgrade-cta:disabled {

      color: #626b7c;

    }

    .stripe-note {
      display: block;
      margin-top: 5px;

      font-size: 9px;
      text-align: center;
    }

      align-self: stretch;
      border-color: transparent;
      background: transparent;

      justify-content: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 650;
    }

    .account-menu-panel {
      display: grid;
      gap: 2px;
      margin: 0 auto;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-elevated);
      box-shadow: var(--shadow-elevated);
    }

      min-height: 40px;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;

      color: var(--text-secondary);
      font-size: 11px;
      text-align: left;

    .account-menu-panel button:hover {
      background: var(--surface-tinted);
      color: var(--text-primary);

    .state-screen {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: var(--space-3) var(--space-2);
      text-align: center;
    }

    .state-description {
      max-width: 340px;
      margin-top: var(--space-1);
      color: var(--text-secondary);

      height: 62px;

      place-items: center;
      border-radius: 19px;
      background: #e8e9ff;

      position: absolute;
      inset: -5px;
      border: 2px solid transparent;
      border-top-color: #6959df;
      border-radius: 23px;
      content: "";
      animation: spin 1s linear infinite;

    .brand-loader img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    .state-icon-progress {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: var(--space-2);

      border-radius: 50%;
      animation: spin 1s linear infinite;

      border-radius: 50%;
      background: var(--gradient-brand);

      gap: var(--space-1-5);

    .empty-state {

      justify-content: flex-start;
      padding: var(--space-3) var(--space-2) var(--space-2);

      border-radius: var(--radius-card);
      background: var(--surface);
    }

    .empty-preview {
      display: flex;
      width: 220px;
      max-width: 80%;
      height: 76px;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-2);
      border: 1px solid #d9deea;
      border-radius: 14px;
      background: linear-gradient(160deg, #f6f7ff, #f3f5f9);
    }

    .empty-preview span {
      width: 46px;
      height: 54px;
      border: 1px solid #bec7d8;
      border-radius: 7px;
      background: #fff;
      box-shadow: inset 0 14px 0 #e2e7f0;
    }

    .empty-preview i {
      position: relative;
      width: 44px;
      height: 2px;
      background: #9eabc1;
    }

    .empty-preview i::after {
      position: absolute;
      top: -3px;
      right: 0;
      width: 7px;
      height: 7px;
      border-top: 2px solid #8c99b0;
      border-right: 2px solid #8c99b0;
      content: "";
      transform: rotate(45deg);
    }

    .empty-instructions {
      width: 100%;
      margin: var(--space-2) 0;
      padding: 0;
      color: var(--text-secondary);
      counter-reset: steps;
      font-size: 11px;
      list-style: none;
      text-align: left;
    }

    .empty-instructions li {
      position: relative;
      min-height: 32px;
      padding: 7px 0 7px 34px;
      border-top: 1px solid var(--divider);
      counter-increment: steps;
    }

    .empty-instructions li::before {
      position: absolute;
      top: 5px;
      left: 0;
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--info-surface);
      color: var(--primary-action);
      content: counter(steps);
      font-size: 10px;
      font-weight: 800;
    }

    .progress-screen {
      min-height: 100%;
      justify-content: flex-start;
      padding-top: var(--space-4);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      margin-top: var(--space-3);

      border-radius: var(--radius-pill);
      background: #dfe3ed;
    }

    .progress-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--gradient-brand);
      transition: width var(--motion-standard) var(--motion-easing);
    }

    .progress-meta {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .progress-meta strong {
      color: var(--text-primary);
    }

    .progress-steps {
      width: 100%;
      margin-top: var(--space-3);
      padding: 0;
      list-style: none;
      text-align: left;
    }

    .progress-steps li {
      position: relative;
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 650;
    }

    .progress-steps li:not(:last-child)::after {
      position: absolute;
      top: 31px;
      bottom: -9px;
      left: 13px;
      width: 1px;
      background: #d6dbe6;
      content: "";
    }

    .progress-steps li.is-complete:not(:last-child)::after {
      background: #8ccbb5;
    }

    .step-indicator {
      position: relative;
      z-index: 1;
      display: inline-flex;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      align-items: center;
      justify-content: center;
      border: 1px solid #cbd1dd;
      border-radius: 50%;
      background: var(--background);
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 800;
    }

    .is-current .step-indicator {
      border-color: #5d5ed4;
      background: #edecff;
      color: #4c40bd;
      box-shadow: 0 0 0 3px rgba(100, 84, 221, 0.1);

      color: var(--text-primary) !important;

    .is-complete .step-indicator {
      border-color: #8fcdb8;
      background: var(--success-surface);
      color: var(--success);

      gap: 6px;
      margin-top: var(--space-2);

      color: var(--text-secondary);

    }

    .post-success-email {
      padding: var(--space-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
    }

    .post-success-email h2 {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .post-success-email p {
      margin: 0 0 var(--space-2);
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .post-success-email-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .upgrade-pass-cta {
      width: 100%;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 480px) {
      .setup-scroll,
      .success-scroll,
      .empty-screen-wrap {
        padding: var(--space-2);
      }

      .section-card {
        padding: var(--space-2);
      }

      .flow-meta {
        grid-template-columns: auto auto 1fr;
      }

      .flow-meta > span:last-child {
        grid-column: auto;
        justify-content: flex-end;
      }

      .sticky-action-bar {
        padding-right: var(--space-2);
        padding-left: var(--space-2);
      }
    }

    @media (max-width: 379px) {
      .app-header {
        padding-left: var(--space-1-5);
      }

      .voice-button {
        width: 40px;
        justify-content: center;
        padding: 0;
      }

      .voice-button span {
        display: none;
      }

      .setup-scroll,
      .success-scroll,
      .empty-screen-wrap {
        padding: 10px;
      }

      .section-card {
        padding: 10px;
      }

      .flow-preview {
        padding: 8px;
      }

      .option-tile {
        padding-right: 5px;
        padding-left: 5px;
      }

      .secondary-action-row {
        grid-template-columns: 1fr;
      }

      .value-strip {
        grid-template-columns: 1fr;
      }

      .checkout-recovery {
        align-items: stretch;
        flex-direction: column;
      }

      .recovery-actions {
        justify-content: flex-start;
      }
    }

    @media (max-height: 650px) {
      .setup-scroll,
      .success-scroll {
        padding-top: 10px;
      }

      .setup-screen,
      .success-screen {
        gap: 10px;
      }

      .state-screen {
        padding-top: var(--space-2);
        padding-bottom: var(--space-2);
      }

      .progress-screen {
        padding-top: var(--space-2);
      }

      .progress-steps {
        margin-top: var(--space-2);
      }

      .progress-steps li {
        min-height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  .billing-notice { margin: 12px 20px 0; padding: 14px; border: 1px solid #c89238; border-radius: 8px; background: #fff7e6; color: #503509; font-size: 12px; line-height: 1.5; }
.billing-notice strong { display: block; font-size: 13px; }

.example-picker summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
.example-picker p { line-height: 1.5; }
.example-picker button { width: 100%; margin-bottom: 8px; }

.setup-recommendation h2 { margin: 3px 0 6px; font-size: 15px; }
.setup-recommendation p:not(.section-eyebrow) { margin: 0 0 12px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
.setup-recommendation .primary-action { width: 100%; }

.connect-your-own-flow summary { cursor: pointer; padding: 8px 0; font-weight: 600; }
